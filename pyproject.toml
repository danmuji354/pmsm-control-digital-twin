[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pmsm-control-digital-twin"
version = "0.1.0"
description = "PMSM dq digital twin comparing PI field-oriented and predictive current control."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "danmuji354"}]
dependencies = ["numpy>=1.26", "PyYAML>=6", "matplotlib>=3.8", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
gem = ["gym-electric-motor>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
